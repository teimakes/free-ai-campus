<title id="title">From scratch: ML/DL, LLM, AI Agent — 무료 대학 공개강의 학습 경로</title>
<desc id="desc">ML/DL은 서울대 ML/DL I, MIT 6.S191, Stanford CS231n. LLM은 Stanford CS224N, CS336, CMU 11-711. AI Agent는 Stanford CS221, CMU 11-768, Stanford CS329A 순서입니다. CS231n과 CS224N의 2026 표시는 자료 연도이며 공개 영상은 각각 2025, 2024년입니다. CMU AI Agents 2026 가을 강의는 진행 중입니다.</desc>
